<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physics Test Solutions</title>
<style>
:root{
  --bg:#faf9f5; --surface:#ffffff; --surface-alt:#f3f1ec;
  --text:#1f1e1c; --text-2:#5f5e5a; --text-3:#8a8880;
  --line:#e2dfd7; --line-2:#cfcbc0;
  --accent:#185fa5; --accent-bg:#e6f1fb; --accent-line:#85b7eb;
  --ok:#3b6d11; --ok-bg:#eaf3de; --ok-line:#97c459;
  --warn:#854f0b; --warn-bg:#faeeda; --warn-line:#efc27a;
  --charge:#d85a30; --e1:#d85a30; --e2:#185fa5; --force:#6b3fa0;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1915; --surface:#242320; --surface-alt:#2e2d28;
    --text:#edebe4; --text-2:#b4b2a9; --text-3:#8a8880;
    --line:#3a3833; --line-2:#4a4842;
    --accent:#85b7eb; --accent-bg:#0c3254; --accent-line:#185fa5;
    --ok:#97c459; --ok-bg:#1f3310; --ok-line:#3b6d11;
    --warn:#efc27a; --warn-bg:#3a2a10; --warn-line:#854f0b;
    --charge:#f0997b; --e1:#f0997b; --e2:#85b7eb; --force:#c2a3e8;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{padding:20px 0 6px}
header h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--text-2);font-size:14px}
nav{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:inherit;font-size:15px;cursor:pointer;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.tabs button[aria-selected="true"]{color:#0b1e33}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
h3{font-size:17px;margin:0 0 12px;font-weight:600}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.marks{font-size:13px;color:var(--text-2);white-space:nowrap}
.figure{display:flex;justify-content:center;margin:14px 0}
.figure svg{width:100%;max-width:440px;height:auto}
.task{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:8px;padding:12px 14px;margin-top:12px}
.part{font-weight:600;margin-right:6px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:6px}
.sol h3 .tag{display:inline-block;background:var(--surface-alt);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin-right:6px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:none;padding-top:0}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.step .t{font-weight:600}
.step .b{min-width:0}
.answer{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--text);border-radius:8px;padding:12px 14px;margin-top:12px}
.answer b.h{color:var(--ok)}
.tip{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 14px;margin-top:12px}
.tip b.h{color:var(--warn)}
.m{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-style:italic;font-size:1.08em}
.eq{display:block;text-align:center;margin:12px 0;font-size:1.12em;line-height:2.4;
  font-family:"Cambria Math","Times New Roman",Georgia,serif;overflow-x:auto}
.eq .m{font-size:1em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.frac>span{padding:0 4px;white-space:nowrap;line-height:1.35}
.frac>span:first-child{border-bottom:1.5px solid currentColor}
.nw{white-space:nowrap}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.t th{background:var(--surface-alt)}
.pager{display:flex;justify-content:space-between;gap:10px}
.pager button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:10px 14px}
.pager button:disabled{opacity:.4;cursor:default}
footer{text-align:center;color:var(--text-3);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Physics test — worked solutions</h1>
    <div class="sub" id="testTitle"></div>
  </header>
  <nav><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="panel" role="tabpanel"></main>
  <div class="pager">
    <button id="prev">← Previous</button>
    <button id="next">Next →</button>
  </div>
  <footer>Solutions created by Odireleng for Mokgadi</footer>
</div>

/* ---------- small helpers for writing maths ---------- */
const v  = s => `<span class="m">${s}</span>`;
const fr = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const eq = (...xs) => `<div class="eq">${xs.map(x=>`<span class="nw">${x}</span>`).join(" ")}</div>`;
const sci = (a,b) => `${a} × 10<sup>${b}</sup>`;

/* ---------- solution diagrams ---------- */
const AH = (id,color) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${color}"/></marker>`;
const SVGT = `fill="var(--text)" font-family="Georgia,serif" font-size="21"`;

function radial(cx,cy,n,out,color,label){
  let s = "";
  for (let i=0;i<n;i++){
    const a = 2*Math.PI*i/n - Math.PI/2;
    const x1 = cx+22*Math.cos(a), y1 = cy+22*Math.sin(a), x2 = cx+62*Math.cos(a), y2 = cy+62*Math.sin(a);
    s += out ? `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" marker-end="url(#ar5)"/>`
             : `<line x1="${x2.toFixed(1)}" y1="${y2.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" marker-end="url(#ar5)"/>`;
  }
  return `<g stroke="var(--text-2)" stroke-width="1.4">${s}</g>
    <circle cx="${cx}" cy="${cy}" r="16" fill="var(--surface-alt)" stroke="${color}" stroke-width="2"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="21" font-weight="600" fill="var(--text)" font-family="Arial,sans-serif">${out?"+":"−"}</text>
    <text x="${cx}" y="${cy+92}" text-anchor="middle" ${SVGT}>${label}</text>`;
}

function fbd(angleDeg, lenT, lenG, lenE, labT, labG, labE){
  const a = angleDeg*Math.PI/180, cx=200, cy=140;
  const tx = cx - lenT*Math.sin(a), ty = cy - lenT*Math.cos(a);
  const ax = cx - 46*Math.sin(a), ay = cy - 46*Math.cos(a);
  return `<svg viewBox="0 0 400 270" role="img" aria-label="Free-body diagram: tension along the thread, weight down, electric force horizontal">
  <defs>${AH("arF","var(--force)")}</defs>
  <line x1="${cx}" y1="${cy}" x2="${cx}" y2="20" stroke="var(--text-3)" stroke-dasharray="4 4"/>
  <path d="M${cx} ${cy-46} A46 46 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="var(--text)"/>
  <g stroke="var(--force)" stroke-width="2.4">
    <line x1="${cx}" y1="${cy}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" marker-end="url(#arF)"/>
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy+lenG}" marker-end="url(#arF)"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+lenE}" y2="${cy}" marker-end="url(#arF)"/>
  </g>
  <circle cx="${cx}" cy="${cy}" r="9" fill="var(--surface-alt)" stroke="var(--charge)" stroke-width="2"/>
  <g ${SVGT}>
    <text x="${(tx-8).toFixed(0)}" y="${(ty+4).toFixed(0)}" text-anchor="end" font-style="italic">${labT}</text>
    <text x="${cx+12}" y="${cy+lenG}" font-style="italic">${labG}</text>
    <text x="${cx+lenE+8}" y="${cy+5}" font-style="italic">${labE}</text>
    <text x="${cx+8}" y="${cy-54}" font-size="19">${angleDeg}°</text>
  </g>
</svg>`;
}

const SOL = {

  { part:"(a)", fig:"q1a", steps:[
    {t:"Which way does each field point?", b:`A positive charge pushes a test charge away from itself, so its field points <b>away</b> from it. At ${v("P")}, ${v("E")}<sub>1</sub> points away from the top charge (down and to the right), and ${v("E")}<sub>2</sub> points away from the bottom charge (up and to the right).`},
    {t:"Are they the same size?", b:`Yes. Both charges are ${v("+q")}, and both are the same distance from ${v("P")} (the two dotted lines are equal, by symmetry). Same charge and same distance give the same field strength: ${v("E")}<sub>1</sub> = ${v("E")}<sub>2</sub>.`},
    {t:"Split each arrow into parts", b:`Each arrow has a sideways (${v("x")}) part and an up/down (${v("y")}) part. ${v("E")}<sub>1</sub>'s ${v("y")}-part points <b>down</b>; ${v("E")}<sub>2</sub>'s ${v("y")}-part points <b>up</b>. They are equal in size, because the arrows are mirror images of each other.`},
    {t:"Add them", b:`Equal and opposite ${v("y")}-parts cancel to zero. The two ${v("x")}-parts both point to the right, so they add.`}
  ], answer:`The two fields are equal in size and are mirror images about the ${v("x")} axis, so their ${v("y")} components are equal and opposite and cancel. The resultant field at ${v("P")} points along the +${v("x")} direction only.`,

  { part:"(b)", steps:[

    {t:"Field from one charge", b:`Use the point-charge field ${v("E")} = ${v("kq")}/${v("r")}²:${eq(v("E")+"<sub>1</sub> = "+v("E")+"<sub>2</sub> =",fr(v("kq"),v("r")+"²")," = ",fr(v("kq"),v("x")+"² + "+v("a")+"²"))}`},

    {t:"Electric field E", b:`Between parallel plates, ${v("E")} = ${v("σ")}/${v("ε")}<sub>0</sub> = ${v("Q")}/(${v("ε")}<sub>0</sub>${v("A")}). ${v("Q")} and ${v("A")} are unchanged, so ${v("E")} <b>stays the same</b>. The field doesn't depend on the gap.`},

  { part:"(b)", fig:"q3b", steps:[
    {t:"What happens inside the dielectric", b:`The plates' field pulls on the charges in each molecule of the dielectric. The negative side of each molecule is pulled toward the + plate and the positive side toward the − plate. The molecules line up: this is <b>polarization</b>.`},
    {t:"The effect at the surfaces", b:`Inside, the + and − ends of neighbouring molecules cancel. But there is a layer of leftover negative charge on the surface next to the + plate, and positive charge next to the − plate.`},
    {t:"The effect on the field", b:`These surface charges create their own field, pointing the <b>opposite</b> way to the plates' field. The two partly cancel, so the total field is smaller: ${v("E")} = ${v("E")}<sub>0</sub>/${v("K")}.`}

  { part:"(c)", steps:[

    {t:"Work done becomes stored energy", b:`The battery does work moving that charge. That work is not lost: it is stored as electric potential energy in the field between the plates, just like lifting a book stores gravitational potential energy. The amount is ${v("U")} = ½${v("QV")}.`}

const $ = id => document.getElementById(id);
$("testTitle").textContent = TEST.title;
const mk = n => n ? n + (n==1 ? " mark" : " marks") : "";
let cur = 0;

function questionHTML(q){
  return `<div class="card">
    <div class="label">Question</div>
    <div class="qhead"><h2>Question ${q.number}</h2><span class="marks">${mk(q.marks)}</span></div>
    <div>${q.text}</div>
    ${q.figure ? `<div class="figure">${FIGURES[q.figure]}</div>` : ""}
    ${q.parts.map(p=>`<div class="task"><div class="qhead"><span class="part">${p.label||""}</span><span class="marks">${mk(p.marks)}</span></div>${p.text}</div>`).join("")}
    ${q.note ? `<p class="sub" style="margin:12px 0 0">${q.note}</p>` : ""}
  </div>`;
}
function solutionHTML(q){
  return (SOL[q.number]||[]).map(s=>`<div class="card sol">
    <h3>${s.part ? `<span class="tag">${s.part}</span>` : ""}Worked solution</h3>
    ${s.fig ? `<div class="figure">${SFIG[s.fig]}</div>` : ""}
    ${s.steps.map((st,i)=>`<div class="step"><div class="num">${i+1}</div><div class="b"><div class="t">${st.t}</div><div>${st.b}</div></div></div>`).join("")}
    <div class="answer"><b class="h">Answer:</b> ${s.answer}</div>
    ${s.tip ? `<div class="tip"><b class="h">Watch out:</b> ${s.tip}</div>` : ""}
  </div>`).join("");
}
function render(i, scroll){
  cur = Math.max(0, Math.min(TEST.questions.length-1, i));
  const q = TEST.questions[cur];
  $("panel").innerHTML = questionHTML(q) + solutionHTML(q);
  document.querySelectorAll("#tabs button").forEach((b,j)=> b.setAttribute("aria-selected", j===cur ? "true" : "false"));
  const active = document.querySelectorAll("#tabs button")[cur];
  if (active && active.scrollIntoView) active.scrollIntoView({block:"nearest", inline:"center"});
  $("prev").disabled = cur===0; $("next").disabled = cur===TEST.questions.length-1;
  try{ history.replaceState(null, "", "#q"+q.number); }catch(e){}
  if (scroll) window.scrollTo(0,0);
}
$("tabs").innerHTML = TEST.questions.map((q,i)=>`<button role="tab" data-i="${i}">Q${q.number}</button>`).join("");
$("tabs").querySelectorAll("button").forEach(b=> b.onclick = ()=> render(+b.dataset.i, true));
$("prev").onclick = ()=> render(cur-1, true);
$("next").onclick = ()=> render(cur+1, true);
const start = TEST.questions.findIndex(q=> "#q"+q.number === location.hash);
render(start >= 0 ? start : 0, false);
</script>
</body>
</html>
